[project]
name = "cooking-manager"
version = "2.0.0"
description = "Cooking Manager — recettes, menus, courses et macros de la cuisine familiale"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "selectolax>=0.3,<1.0",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "mcp>=1.0",
    "fastmcp>=2.0",
]

[tool.setuptools.packages.find]
include = ["cooking_manager*", "backend*"]

[tool.setuptools.package-data]
cooking_manager = ["*.json"]

[project.scripts]
cooking-manager = "cooking_manager.__main__:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B"]

[tool.pyright]
reportCallIssue = "error"
