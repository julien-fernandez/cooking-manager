    synonyms: ["pas aimé", "pas terrible", "mauvais", "pas fini"]
  - key: refused
    label: "Refusé"
    status: probation
    definition: "N'a pas été mangé du tout."
    applicable_when: "Distinguer d'un interdit alimentaire : un refus se constate à table, une contrainte se déclare dans `person`."
    synonyms: ["refusé", "pas touché", "n'a pas mangé"]

replay_verdicts:
  - key: keep_as_is
    label: "À refaire tel quel"
    status: probation
    definition: "Le plat rentre dans la rotation sans modification."
    synonyms: ["à refaire", "à garder", "tel quel", "on garde"]
  - key: adjust
    label: "À refaire en modifiant"
    status: probation
    definition: "Le plat vaut la peine, mais une correction est nécessaire — laquelle vit dans issue_kinds."
    applicable_when: "Toujours accompagné d'au moins un issue_kinds, sinon la correction est perdue."
    synonyms: ["à ajuster", "à modifier", "à revoir", "presque", "à refaire en modifiant", "à refaire mais", "à refaire avec"]
  - key: situational
    label: "À refaire pour une occasion précise"
    status: probation
    definition: "Le plat reste au répertoire mais ne se propose pas librement — il est lié à un contexte de service, pas à un défaut."
    applicable_when: "L'occasion vit dans le verbatim ; sans occasion nommée, le verdict n'est pas celui-là. Distinguer d'`adjust` : ici le plat n'a rien à corriger."
    synonyms: ["à réserver pour", "seulement pour", "seulement quand", "à garder pour", "uniquement pour", "quand il faut finir"]
  - key: retire
    label: "À ne plus refaire"
    status: probation
    definition: "Le plat sort de la rotation."
    synonyms: ["à oublier", "plus jamais", "on arrête"]

# ============================================================================
# NATURE D'UN PRODUIT — ses macros sont-elles celles d'un aliment ?
# ============================================================================
# Axe posé le 2026-09-08 après avoir été appliqué A LA MAIN aux 170 produits de
# `product` : 90 `single`, 80 `composite`, zero qui resiste. Il tranche ce que
# `food_key` peut vouloir dire, et ce qu'un `food_key` vide veut dire.
# Refs cooking-manager-2 #90.

product_natures:
  - key: single
    label: "Conditionnement d'un aliment"
    status: active
    definition: "Le produit est UN aliment mis en boite, en sachet ou en barquette. Ses macros sont celles de l'aliment, a la marque pres."
    synonyms: ["produit simple", "aliment conditionne"]
    applicable_when: "Le nom designe un aliment que le referentiel porte ou devrait porter : feta, courgettes en rondelles, pignons de pin, flocons d'avoine."
    observed_in: ["Itineraire des Saveurs Feta Grecque AOP", "Picard Courgettes en rondelles surgelees", "Drive A Flocons d'Avoine"]
  - key: composite
    label: "Preparation a plusieurs ingredients"
    status: active
    definition: "Le produit combine plusieurs aliments. Aucun d'eux ne porte ses macros : elles lui sont propres."
    synonyms: ["plat cuisine", "preparation", "assaisonnement compose"]
    applicable_when: "Le nom designe un plat, une patisserie, un assaisonnement compose, un complement ou une boisson preparee."
    observed_in: ["Picard Lasagnes Legumes Grilles Mozzarella", "pesto-genovese", "Snickers hi-protein", "Patak's Sauce Tikka Masala"]

