effort_bands:
  - key: hands_off
    label: "Les mains libres"
    status: probation
    definition: "La cuisson travaille seule — four, mijotage à couvert. On pose et on part."
    applicable_when: "Aucune étape ne demande une présence continue, et la cuisson longue est passive."
    synonyms: ["au four", "à couvert", "laisser mijoter", "enfourner", "laisser cuire", "oublier au four"]
  - key: light_hands_on
    label: "Quelques gestes"
    status: probation
    definition: "Une poêlée, une salade composée, un assemblage : des gestes courts, pas de surveillance."
    synonyms: ["mélanger", "assembler", "arroser", "égoutter", "couper", "émincer"]
  - key: hands_on
    label: "Devant la casserole"
    status: probation
    definition: "Présence continue exigée : on ne peut pas quitter la cuisine."
    applicable_when: "Une étape impose de remuer sans arrêt, de surveiller, ou de mener plusieurs feux de front."
    synonyms: ["remuer sans cesse", "sans cesser de remuer", "louche par louche", "surveiller", "ne pas quitter", "en remuant constamment"]
  - key: project
    label: "Plat de week-end"
    status: probation
    definition: "Façonnage, montage ou repos : le plat se construit en plusieurs temps."
    applicable_when: "Le plat demande de façonner, farcir, monter, ou de respecter un repos entre deux étapes."
    synonyms: ["façonner", "former des boulettes", "farcir", "monter", "laisser reposer", "pétrir", "abaisser", "rouler"]

# ============================================================================
# food_kinds — la famille culinaire d'un aliment (ADR 0033)
# ============================================================================
# `active` = la clé qualifie DÉJÀ un aliment en base (mesuré le 2026-09-23, les
# douze valeurs présentes, renommées en anglais dans la même migration).
# `probation` = la clé vient de la note de cadrage du 2026-05-22 et n'a encore
# qualifié aucun aliment. Elle existe parce qu'un critère méditerranéen la cite.

food_kinds:
  - key: butter
    label: "Beurre"
    status: active
    definition: "Matière grasse laitière."
  - key: biscuit
    label: "Biscuit"
    status: active
    definition: "Produit sucré sec de l'épicerie."
  - key: grain
    label: "Céréale"
    status: active
    definition: "Céréale dont le degré de raffinage n'a pas été tranché."
    dominates: ["whole-grain", "refined-grain"]
  - key: cured-meat
    label: "Charcuterie"
    status: active
    definition: "Viande salée, fumée ou séchée."
  - key: flour
    label: "Farine"
    status: active
    definition: "Céréale ou légumineuse moulue."
  - key: cheese
    label: "Fromage"
    status: active
    definition: "Laitage affiné ou frais vendu comme fromage."
  - key: dairy
    label: "Laitage"
    status: active
    definition: "Lait et produits laitiers hors fromage."
  - key: legume
    label: "Légumineuse"
    status: active
    definition: "Lentille, pois chiche, haricot, fève."
  - key: nut
    label: "Oléagineux"
    status: active
    definition: "Fruit à coque et graine oléagineuse."
  - key: bread
    label: "Pain"
    status: active
    definition: "Pain et panification."
  - key: breading
    label: "Panure"
    status: active
    definition: "Chapelure et enrobage de friture."
  - key: fish
    label: "Poisson"
    status: active
    definition: "Poisson dont la teneur en lipides n'a pas été tranchée."
    dominates: ["oily-fish", "lean-fish"]
  - key: vegetable
    label: "Légume"
    status: probation
    definition: "Légume frais, surgelé ou en conserve."
  - key: fruit
    label: "Fruit"
    status: probation
    definition: "Fruit frais entier, hors jus."
  - key: whole-grain
    label: "Céréale complète"
    status: probation
    definition: "Céréale dont le son et le germe sont conservés."
  - key: refined-grain
    label: "Céréale raffinée"
    status: probation
    definition: "Céréale blutée, son et germe retirés."
  - key: oily-fish
    label: "Poisson gras"
    status: probation
    definition: "Poisson riche en oméga-3 : sardine, maquereau, saumon, hareng, truite."
  - key: lean-fish
    label: "Poisson maigre"
    status: probation
    definition: "Poisson pauvre en lipides : cabillaud, lieu, merlan, sole."
