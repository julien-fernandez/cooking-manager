# ============================================================================
# TECHNIQUES D'ACCOMMODATION — comment un plat sert un convive incompatible
# ============================================================================
# Le corpus annoté du 2026-09-02 (docs/conception/CORPUS_ACCOMMODATIONS.md) a
# remplacé l'unique observation `mafe-poulet` par 8 observations ancrées sur les
# 28 recettes de famille « servie à une tablée ». Chaque statut ci-dessous porte
# son compte. La mesure a produit deux surprises :
#   - `self_service` n'existait pas et c'est la technique LA PLUS pratiquée ;
#   - `separate_dish` existait et n'a AUCUNE observation.
#
# ⚠️ Le marqueur de détection n'est pas « à part » — quatre recettes disent
# « à part » pour parler de cuisson ou de dressage. C'est la présence d'un NOM
# DE CONVIVE ou d'un marqueur collectif (« libre-service », « chacun ») dans la
# même phrase qui fait l'accommodation.
accommodations:
  - key: self_service
    label: "Libre-service"
    status: active
    definition: "L'ingrédient litigieux est servi à part, chacun se sert ; le convive arbitre, pas la recette."
    applicable_when: "L'ingrédient est ajoutable après coup sans recuisson — crudité, condiment, garniture."
    observed_in: ["salade-vietnamienne", "sandwiches-rillettes-thon", "sandwiches-saumon-fume-saint-moret", "tortilla-pizza-atelier"]
  - key: full_substitution
    label: "Substitution totale"
    status: active
    definition: "L'ingrédient est remplacé pour tout le monde ; le plat change."
    applicable_when: "L'ingrédient est fondu dans la préparation — haché, mariné, mijoté dans la base, réduit en sauce."
    observed_in: ["mafe-poisson-legumes", "salade-lentilles-froides-graines-courge", "tagliatelles-carbonara-vege"]
  # ⚠️ Deux des trois observations de `full_substitution` sont matérialisées par
  # une FICHE JUMELLE (mafe-poulet / mafe-poisson-legumes : étapes 1-5 identiques,
  # protéine remplacée), pas par une règle appliquée à la volée. Une réparation
  # devrait chercher la fiche jumelle avant de recomposer une substitution.
  - key: separate_portion
    label: "Part séparée"
    status: probation
    definition: "Le plat est cuisiné tel quel ; une part reçoit un ingrédient différent au service."
    applicable_when: "L'ingrédient est ajouté tard — posé sur le plat, saisi à part, incorporé au service."
    observed_in: ["mafe-poulet"]
  # Reste en probation : UNE observation. Le corpus l'a confirmée sans l'élargir.
  - key: separate_dish
    label: "Plat séparé"
    status: probation
    definition: "Un plat distinct est préparé pour le convive incompatible."
    applicable_when: "Ni la substitution ni la part séparée ne tiennent — le plat est indissociable de son ingrédient."
    observed_in: []
  # ZÉRO observation sur 28 recettes. Conservée — l'absence dans ce corpus n'est
  # pas une preuve d'impossibilité — mais elle ne pèse pas comme les autres.
  #
  # ⚠️ Décision du 2026-09-03 : « ne pèse pas comme les autres » était jusqu'ici
  # une note humaine que rien n'exécutait. `accommodations_by_evidence()` classe
  # désormais par statut PUIS par nombre d'observations, et un test refuse
  # qu'une accommodation en probation précède une active. `observed_in` est
  # propagé jusqu'à l'artefact JSON depuis la v0.3.0 : avant, il s'arrêtait au
  # YAML, et tout tri par observations aurait compté zéro partout sans erreur.

# ============================================================================
# RETOURS DE TABLE (v0.4.0) — trois axes, trois questions distinctes
# ============================================================================
# Se tromper d'axe produit une donnée qui ne veut rien dire :
#   appreciations   → À QUEL POINT CETTE PERSONNE a aimé (une ligne par convive)
#   replay_verdicts → QUE FAIT-ON DU PLAT ensuite (une ligne par plat)
#   issue_kinds     → QUELLE EST LA NATURE DU DÉFAUT (facultatif, explique un verdict)
#
# Un plat adoré de tous peut être `retire` (trop long un soir de semaine) ; un
# plat moyen peut être `keep_as_is` (dépannage rapide assumé). Les deux axes ne
# se déduisent pas l'un de l'autre — c'est pourquoi ils sont séparés.
#
# TOUT EN PROBATION : mesuré sur 4 retours réels seulement (recipe_execution au
# 2026-09-07), tous à 5/5, tous « adoré par tous ». Quatre retours unanimes ne
# distinguent rien : aucune de ces valeurs n'a encore trié quoi que ce soit.

_scope:
  food_cuts:
    applies_to: "Le mot de TÊTE d'un libellé commercial qui nomme une part ou une mise en forme d'un aliment, sans changer son identité — « Cuisses de poulet blanc » reste du poulet."
    does_not_apply_to:
      - "préparation composée dont l'aliment n'est qu'un ingrédient (« bouillon de poulet », « nuggets », « terrine ») — c'est un autre aliment, jamais une découpe"
      - "qualificatif commercial ou d'élevage (« extra tendre », « fermier », « label rouge ») — il ne dit rien de la part"
      - "état de conservation (« surgelé », « sèches », « fraîche ») — il change l'identité de l'aliment (voir `normalize_name`)"
      - "le libellé où la découpe EST l'aliment du référentiel (`filet de cabillaud`) — la comparaison directe suffit, rien à retirer"
    absence_means: "PAS INSTRUIT — un libellé dont la tête n'est pas listée reste une QUESTION (`status: asked`), jamais une élection d'office."
    known_tensions:
      - "« blanc » est écarté volontairement : il est tour à tour découpe (blanc de poulet), robe (poulet blanc) et part d'œuf (blanc d'œuf). L'ajouter ferait passer « blancs d'œufs » pour des œufs."
      - "`diced` recouvre le dé et l'émincé : deux mises en forme distinctes, indiscernables pour l'identité de l'aliment. À scinder si une quantité en dépend."

  appreciations:
    applies_to: "Un plat cuisiné à la maison et servi à une tablée identifiée."
    does_not_apply_to:
      - "repas hors domicile (ex. « Restaurant en ville » au menu 2026-09-01) — personne n'a cuisiné, il n'y a rien à rejouer"
      - "restes (`<slot>_leftovers: true`) — le jugement porte sur le plat d'origine, le noter deux fois le compterait deux fois"
      - "remplissages macro sans préparation (« Fromage blanc + whey », « Compote + graines de courge ») — la question « c'était bon ? » n'y a pas de sens décisionnel"
    absence_means: "PAS INSTRUIT ou HORS PÉRIMÈTRE — jamais « personne n'a aimé ». Ne pas combler par défaut."
    known_tensions:
      - "`mixed` recouvre deux natures : « bon mais pas terrible » et « une partie du plat oui, une autre non ». Scinder si la distinction devient décisive."
      - "`effort` est un défaut ressenti par le cuisinier, pas par la tablée — seul axe où l'avis de celui qui cuisine prime."

  product_qualities:
    applies_to: "Un produit spécifique acheté et cuisiné — rattaché à un `shopping_product` (drive/ticket) ou au référentiel `marques/`."
    does_not_apply_to:
      - "aliments génériques sans marque ni source identifiable — le jugement porte sur un produit concret, pas sur une catégorie"
      - "plats cuisinés à la maison — c'est `appreciations` qui les couvre"
    absence_means: "PAS INSTRUIT — aucun retour qualité n'a été donné sur ce produit. Ne pas combler par défaut."
    known_tensions:
      - "Un retour peut porter sur le canal (marché vs drive) plutôt que sur le produit lui-même. Le `channel` + `aspect` désambiguent."

  cooking_tip_kinds:
    applies_to: "Une recette cuisinée au moins une fois — le tip vient de l'expérience, pas de la lecture."
    does_not_apply_to:
      - "recettes jamais cuisinées — c'est de la planification, pas un retour"
    absence_means: "PAS INSTRUIT — aucun tip n'a été donné. Ne pas combler."
    known_tensions:
      - "`ingredient_tweak` chevauche une substitution : l'un modifie une quantité/forme, l'autre remplace un ingrédient entier."

  substitution_outcomes:
    applies_to: "Un remplacement d'ingrédient effectivement testé à table dans une recette identifiée."
    does_not_apply_to:
      - "substitutions théoriques de `substitutions.py` non testées — elles sont des suggestions, pas des retours"
    absence_means: "PAS INSTRUIT — la substitution n'a pas été évaluée."
    known_tensions:
      - "Un substitut `success` dans un contexte (enfants) peut être `failure` dans un autre (adultes). Le champ `who_preferred` désambigue."

  effort_bands:
    applies_to: "Tout plat dont les ÉTAPES sont écrites — la bande est dérivée du texte, comme `has_anchored_stew`."
    does_not_apply_to:
      - "un repas `leftovers`, qui n'a pas de fiche donc pas d'étapes"
      - "un plat dont les étapes ne décrivent aucun geste (fiche squelette)"
    absence_means: "PAS DÉRIVABLE — les étapes manquent. Jamais « plat facile » : c'est le défaut le plus coûteux, il ferait passer toute recette non instruite pour un plat de semaine."
    known_tensions:
      - "L'horloge et l'effort divergent : un mijoté de 50 min est `hands_off`, un risotto de 35 min est `hands_on`. Un plafond sur `total_time_min` classerait les deux à l'envers."
      - "La bande est DÉRIVÉE, donc `probation` par construction. Elle ne passe `active` que confirmée au service, dans `service_context` — un plat qu'on a réellement tenu un mardi soir."
      - "`issue_kinds/effort` note un effort DISPROPORTIONNÉ après coup (ça n'en valait pas la peine). `effort_bands` mesure la charge avant de cuisiner. Les deux peuvent diverger : un plat `light_hands_on` peut être jugé non rentable."

  service_contexts:
    applies_to: "Un plat dont le contexte de service a été identifié par l'expérience (pas par lecture de la recette)."
    does_not_apply_to:
      - "plats jamais cuisinés"
    absence_means: "PAS INSTRUIT — le plat n'a pas de contexte de service déclaré. Ne signifie pas « universel »."
    known_tensions:
      - "Un plat peut avoir plusieurs contextes (`batch_cooking` + `next_day`). Les valeurs ne s'excluent pas."

  product_natures:
    applies_to: "Tout produit du référentiel `marques/` — la question « ses macros sont-elles celles d'un aliment ? » a toujours une réponse."
    does_not_apply_to: []
    absence_means: "PAS INSTRUIT — le produit n'a pas encore été classé. Jamais « il n'a pas d'aliment parent » : c'est ce que dit `composite`, et lui seul."
    known_tensions:
      - "Un mélange nature (« Fruits Rouges surgelés », « Trio de Poivrons », « Mélange de Légumes Verts ») porte plusieurs aliments sans transformation. Classé `single` parce que le référentiel porte déjà des aliments-mélanges (`fruit rouge melange`, `legume du soleil`) — mais c'est un choix, pas une évidence. Scinder si la distinction devient décisive."
      - "`food` contient déjà des préparations promues au rang d'aliment (`soupe pois casse industrielle`, `vinaigrette classique`, `sauce teriyaki`, `flan patissier`). La frontière single/composite traverse donc aussi le référentiel aliment, où rien ne la déclare."
      - "Un assaisonnement composé (pesto, pâte de curry, vinaigrette) est `composite` par construction, alors qu'on ne le mange pas comme un plat. La valeur dit « pas d'aliment parent », pas « c'est un plat »."

  food_kinds:
    applies_to: "Tout aliment du référentiel `food` — la famille culinaire dont il relève."
    does_not_apply_to:
      - "un `product` : il porte une marque et un conditionnement, sa famille est celle de son `food_key`"
      - "une ligne d'ingrédient de recette : elle nomme un aliment, elle n'en est pas un"
    absence_means: "PAS INSTRUIT — l'aliment n'a pas été classé. Jamais « ne relève d'aucune famille ». Mesuré le 2026-09-23 : 177 aliments sur 192 sans `kind`, donc l'absence est l'état DOMINANT du référentiel."
    known_tensions:
      - "`food.category` (rayon de courses) et `food.kind` (famille culinaire) se recouvrent sans se confondre : `feculents-legumineuses` réunit ce que `legume` et `whole-grain` séparent. C'est cette confusion qui rendait les critères 3 et 4 indérivables (ADR 0033)."
      - "Les douze clés `active` sont celles RÉELLEMENT écrites en base au 2026-09-23, renommées en anglais dans la même migration. Les huit autres viennent de la note de cadrage du 2026-05-22 et n'ont encore qualifié aucun aliment — d'où leur `probation`."
      - "`grain` et ses deux raffinements (`whole-grain`, `refined-grain`) coexistent : les trois aliments déjà classés `grain` n'ont pas été rejugés. Un aliment resté `grain` ne satisfait AUCUN critère — ce n'est pas un défaut de l'axe, c'est une qualification qui manque."

  mediterranean_criteria:
    applies_to: "Une journée ou une semaine de menu dont les ingrédients sont rattachés à un aliment (`recipe_ingredient.food_key`)."
    does_not_apply_to:
      - "un repas `leftovers` : il n'a pas de fiche, donc aucun ingrédient à confronter (#76)"
      - "un repas hors domicile : personne n'a choisi les ingrédients"
      - "les autres convives — le cadre vise le seul profil de Julien (note du 2026-05-22)"
    absence_means: "PAS MESURABLE — aucun ingrédient rattaché. Jamais « critère non tenu » : mesuré le 2026-09-23, le rattachement vaut 0 ligne sur 1169, donc un score dérivé aujourd'hui vaudrait zéro partout sans rien dire."
    known_tensions:
      - "Le critère 9 (eau + thé vert) ne déclare aucun `food_kind` : rien dans une recette ne porte l'eau bue dans la journée. Il se lit HORS DE PORTÉE, jamais « non tenu » — sinon il fait baisser un score qu'aucun geste ne peut relever."
      - "Les seuils du cadre (« ≥ 3 portions », « ≥ 1 c. à soupe ») ne sont pas portés ici : une portion n'est pas dérivable de la base tant que `person` n'a pas de profil nutritionnel (#78). L'axe dit QUELS aliments comptent, pas COMBIEN il en faut."
      - "`recipe.mediterranean_criteria` (`INTEGER[]`) porte trois annotations manuelles antérieures. `code` en donne la lecture, mais la dérivation ne les consomme pas : elles témoignent d'un geste abandonné."

appreciations:
  - key: loved
    label: "Adoré"
    status: probation
    definition: "En redemande, à remettre au menu sans hésiter."
    synonyms: ["adoré", "excellent", "top", "délicieux", "en redemande"]
  - key: liked
    label: "Aimé"
    status: probation
    definition: "Mangé avec plaisir, sans enthousiasme particulier."
    synonyms: ["aimé", "bien", "bon", "correct", "sympa"]
  - key: mixed
    label: "Mitigé"
