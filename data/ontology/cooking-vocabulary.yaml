issue_kinds:
  - key: seasoning
    label: "Assaisonnement"
    status: probation
    definition: "Trop ou pas assez : sel, épices, acidité, sucre."
    synonyms: ["fade", "trop salé", "trop épicé", "trop piquant", "manque de goût", "trop acide"]
  - key: texture
    label: "Texture"
    status: probation
    definition: "Consistance ratée indépendamment de la cuisson : pâteux, sec, filandreux, détrempé."
    synonyms: ["pâteux", "sec", "filandreux", "détrempé", "spongieux"]
  - key: doneness
    label: "Cuisson"
    status: probation
    definition: "Trop cuit ou pas assez."
    synonyms: ["trop cuit", "pas assez cuit", "cramé", "cru", "brûlé"]
  - key: portion
    label: "Quantité"
    status: probation
    definition: "Trop ou pas assez servi — vise le calcul de portions, pas le goût."
