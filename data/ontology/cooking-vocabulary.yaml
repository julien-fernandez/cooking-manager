# ============================================================================
# mediterranean_criteria — les 9 critères de la note du 2026-05-22 (ADR 0033)
# ============================================================================
# `code` porte le numéro du critère dans la note, seule lecture possible des
# trois annotations `recipe.mediterranean_criteria` antérieures.
# `satisfied_by` porte les `food_kinds` qui satisfont le critère : la couverture
# se DÉRIVE de l'aliment, jamais d'une saisie à la main.
# Un critère sans `satisfied_by` est HORS DE PORTÉE et doit dire pourquoi.

food_cuts:
  - key: fillet
    label: "Filet"
    status: active
    definition: "Muscle levé entier, sans os."
    synonyms: ["filets", "escalope", "escalopes", "aiguillette", "aiguillettes"]
  - key: thigh
    label: "Cuisse"
    status: active
    definition: "Membre postérieur entier ou sa partie haute."
    synonyms: ["cuisses", "haut de cuisse", "hauts de cuisse"]
  - key: drumstick
    label: "Pilon"
    status: active
    definition: "Bas de cuisse de volaille, avec son os."
    synonyms: ["pilons"]
  - key: wing
    label: "Aile"
    status: active
    definition: "Membre antérieur de volaille."
    synonyms: ["ailes", "manchon", "manchons"]
  - key: roast
    label: "Rôti"
    status: active
    definition: "Pièce ficelée destinée au four."
    synonyms: ["rotis"]
  - key: diced
    label: "Cube"
    status: active
    definition: "Chair détaillée en dés."
    synonyms: ["cubes", "morceau", "morceaux", "émincé", "émincés"]
  - key: slice
    label: "Tranche"
    status: active
    definition: "Chair coupée en tranches."
    synonyms: ["tranches"]


mediterranean_criteria:
  - key: vegetables
    label: "Légumes"
    status: probation
    code: "1"
    definition: "Au moins 3 portions par jour, dont une crue."
    satisfied_by: ["vegetable"]
  - key: fruits
    label: "Fruits"
    status: probation
    code: "2"
    definition: "Au moins 2 portions par jour, entiers, jamais en jus."
    satisfied_by: ["fruit"]
  - key: legumes
    label: "Légumineuses"
    status: probation
    code: "3"
    definition: "Au moins une portion par jour."
    satisfied_by: ["legume"]
  - key: whole-grains
    label: "Céréales complètes"
    status: probation
    code: "4"
    definition: "Au moins une portion par jour, hors riz."
    satisfied_by: ["whole-grain"]
  - key: oily-fish
    label: "Poisson gras"
    status: probation
    code: "5"
    definition: "Au moins deux fois par semaine."
    satisfied_by: ["oily-fish"]
  - key: olive-oil
    label: "Huile d'olive"
    status: probation
    code: "6"
    definition: "Au moins une cuillère à soupe par jour, extra-vierge de préférence."
    satisfied_by: ["olive-oil"]
  - key: dairy
    label: "Produits laitiers"
    status: probation
    code: "7"
    definition: "Au moins une portion par jour, jamais 0 % de matière grasse."
    satisfied_by: ["dairy", "cheese"]
  - key: nuts
    label: "Fruits secs et noix"
    status: probation
    code: "8"
    definition: "Environ une poignée par jour."
    satisfied_by: ["nut"]
  - key: water-and-tea
    label: "Eau et thé vert"
    status: probation
    code: "9"
    definition: "Six à huit verres d'eau et au moins une infusion par jour."
    applicable_when: "Hors de portée : aucun ingrédient de recette ne porte la boisson d'une journée. Se lit HORS DE PORTÉE, jamais « non tenu »."
